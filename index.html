<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm GDQP&AN 11</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --success-bg: #d1fae5;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Thanh công cụ dính trên đầu trang */
        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 1000;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .score-text { color: var(--primary); }
        .progress-text { color: var(--text-light); }

        .progress-bar-bg {
            width: 100%;
            max-width: 800px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #2dd4bf);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        /* Container câu hỏi */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 15px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .lesson-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Style cho từng đáp án */
        .option-label {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            background: #fff;
            position: relative;
        }

        .option-label:hover:not(.disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-label input[type="radio"] {
            display: none; /* Ẩn nút radio mặc định */
        }

        /* Custom Radio Button */
        .radio-custom {
            width: 20px;
            height: 20px;
            border: 2px solid #94a3b8;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.2s;
        }

        .option-label input[type="radio"]:checked + .radio-custom {
            border-color: var(--primary);
        }

        .option-label input[type="radio"]:checked + .radio-custom::after {
            transform: scale(1);
        }

        /* Trạng thái sau khi trả lời */
        .option-label.disabled {
            cursor: default;
            opacity: 0.9;
        }

        .option-label.correct {
            background-color: var(--success-bg);
            border-color: var(--success);
            color: #065f46;
        }

        .option-label.correct .radio-custom {
            border-color: var(--success);
            background-color: var(--success);
        }
        
        .option-label.correct .radio-custom::after {
            background: white; /* Đổi màu nhân radio */
            transform: scale(1);
        }

        .option-label.wrong {
            background-color: var(--danger-bg);
            border-color: var(--danger);
            color: #991b1b;
        }

        .option-label.wrong .radio-custom {
            border-color: var(--danger);
            background-color: var(--danger);
        }

        .option-label.wrong .radio-custom::after {
            background: white;
            transform: scale(1);
        }

        /* Hiển thị đáp án đúng nếu chọn sai */
        .option-label.show-correct {
            border-color: var(--success);
            border-style: dashed;
            background-color: #f0fdf4;
        }
        
        .icon-result {
            margin-left: auto;
            font-size: 1.2rem;
            display: none;
        }
        
        .correct .icon-result, .wrong .icon-result, .show-correct .icon-result {
            display: block;
        }

        #completion-modal {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 30px;
            border: 2px solid var(--primary);
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-restart:hover { background-color: var(--primary-dark); }
    </style>
</head>
<body>

<div class="sticky-header">
    <div class="stats-container">
        <div class="score-text">Đúng: <span id="score">0</span>/<span id="total-questions">50</span></div>
        <div class="progress-text">Tiến độ: <span id="answered-count">0</span>/50</div>
    </div>
    <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
</div>

<div class="container">
    <div id="quiz-container">
        <!-- Các câu hỏi sẽ được render bằng JS -->
    </div>

    <div id="completion-modal">
        <h2>🎉 ĐÃ HOÀN THÀNH BÀI KIỂM TRA 🎉</h2>
        <h1 style="font-size: 3rem; color: var(--primary); margin: 15px 0;" id="final-score">0/50</h1>
        <p id="final-message" style="font-size: 1.2rem; color: var(--text-light); margin-bottom: 20px;"></p>
        <button class="btn-restart" onclick="location.reload()">Làm lại từ đầu</button>
    </div>
</div>

<script>
    // BỘ 50 CÂU HỎI (15 câu Bài 2, 35 câu Bài 6)
    const questions = [
        { l: "Bài 2", q: "Theo Luật NVQS 2015, công dân nam đủ bao nhiêu tuổi trở lên phải đăng ký nghĩa vụ quân sự?", opts: { A: "16 tuổi", B: "17 tuổi", C: "18 tuổi", D: "19 tuổi" }, a: "B" },
        { l: "Bài 2", q: "Độ tuổi gọi nhập ngũ trong thời bình đối với công dân nam không học cao đẳng, đại học là?", opts: { A: "18 đến hết 22 tuổi", B: "18 đến hết 25 tuổi", C: "18 đến hết 27 tuổi", D: "18 đến hết 30 tuổi" }, a: "B" },
        { l: "Bài 2", q: "Công dân nam được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn thì độ tuổi gọi nhập ngũ đến hết bao nhiêu tuổi?", opts: { A: "25 tuổi", B: "26 tuổi", C: "27 tuổi", D: "28 tuổi" }, a: "C" },
        { l: "Bài 2", q: "Cơ quan nào có thẩm quyền đăng ký nghĩa vụ quân sự cho công dân cư trú tại địa phương?", opts: { A: "Công an cấp xã", B: "UBND cấp huyện", C: "Ban Chỉ huy quân sự cấp xã", D: "Hội đồng NVQS cấp tỉnh" }, a: "C" },
        { l: "Bài 2", q: "Thời gian khám sức khỏe gọi nhập ngũ và thực hiện nghĩa vụ tham gia CAND hàng năm thường diễn ra vào thời gian nào?", opts: { A: "Từ 1/1 đến 30/2", B: "Từ 1/11 đến 31/12", C: "Từ 1/5 đến 31/6", D: "Từ 1/8 đến 30/9" }, a: "B" },
        { l: "Bài 2", q: "Lễ giao nhận quân hằng năm thường được tổ chức vào khoảng thời gian nào?", opts: { A: "Tháng 2 hoặc tháng 3", B: "Tháng 11 hoặc tháng 12", C: "Tháng 5 hoặc tháng 6", D: "Tháng 8 hoặc tháng 9" }, a: "A" },
        { l: "Bài 2", q: "Hành vi nào sau đây bị nghiêm cấm trong thực hiện nghĩa vụ quân sự?", opts: { A: "Đăng ký NVQS đúng hạn", B: "Trốn tránh thực hiện NVQS", C: "Khám sức khỏe theo lệnh gọi", D: "Chấp hành lệnh gọi nhập ngũ" }, a: "B" },
        { l: "Bài 2", q: "Công dân nữ có phải thực hiện nghĩa vụ quân sự không?", opts: { A: "Bắt buộc như nam giới", B: "Hoàn toàn không được tham gia", C: "Tự nguyện tham gia nếu quân đội có nhu cầu", D: "Chỉ được làm công tác y tế" }, a: "C" },
        { l: "Bài 2", q: "Thời hạn phục vụ tại ngũ trong thời bình của hạ sĩ quan, binh sĩ là bao nhiêu tháng?", opts: { A: "12 tháng", B: "18 tháng", C: "24 tháng", D: "36 tháng" }, a: "C" },
        { l: "Bài 2", q: "Thời hạn thực hiện nghĩa vụ tham gia Công an nhân dân là bao nhiêu tháng?", opts: { A: "18 tháng", B: "24 tháng", C: "30 tháng", D: "36 tháng" }, a: "B" },
        { l: "Bài 2", q: "Đối tượng nào sau đây được TẠM HOÃN gọi nhập ngũ?", opts: { A: "Con của liệt sĩ", B: "Học sinh đang học THPT", C: "Người không đủ sức khỏe phục vụ tại ngũ", D: "Cán bộ, công chức" }, a: "B" },
        { l: "Bài 2", q: "Đối tượng nào sau đây được MIỄN gọi nhập ngũ?", opts: { A: "Sinh viên đại học", B: "Người lao động duy nhất nuôi gia đình", C: "Con của liệt sĩ, con của thương binh hạng một", D: "Học sinh giỏi cấp quốc gia" }, a: "C" },
        { l: "Bài 2", q: "Tiêu chuẩn tuyển quân thực hiện nghĩa vụ tham gia CAND bao gồm những gì?", opts: { A: "Chỉ cần đủ chiều cao và cân nặng", B: "Lý lịch rõ ràng, nghiêm chỉnh chấp hành pháp luật, đủ sức khỏe", C: "Phải là đảng viên Đảng Cộng sản Việt Nam", D: "Phải tốt nghiệp đại học trở lên" }, a: "B" },
        { l: "Bài 2", q: "Một trong những trách nhiệm của học sinh trong việc thực hiện NVQS là?", opts: { A: "Tìm mọi cách để được tạm hoãn", B: "Không cần tìm hiểu pháp luật về NVQS", C: "Học tập chính trị, quân sự; chấp hành quy định về đăng ký NVQS", D: "Tự ý bỏ học để nhập ngũ" }, a: "C" },
        { l: "Bài 2", q: "Việc xử lý công dân vi phạm pháp luật về nghĩa vụ quân sự được quy định như thế nào?", opts: { A: "Chỉ bị nhắc nhở", B: "Xử phạt hành chính hoặc truy cứu trách nhiệm hình sự", C: "Đuổi học hoặc buộc thôi việc", D: "Không bị xử lý nếu dưới 18 tuổi" }, a: "B" },

        // --- BÀI 6 ---
        { l: "Bài 6", q: "Súng tiểu liên AK do ai thiết kế?", opts: { A: "M.T. Kalashnikov", B: "Simonov", C: "Makarov", D: "Tokarev" }, a: "A" },
        { l: "Bài 6", q: "Súng tiểu liên AK (phiên bản chuẩn) ra đời vào năm nào?", opts: { A: "1943", B: "1945", C: "1947", D: "1954" }, a: "C" },
        { l: "Bài 6", q: "Cỡ đạn của súng tiểu liên AK là bao nhiêu?", opts: { A: "5,56 mm", B: "7,62 mm", C: "9 mm", D: "12,7 mm" }, a: "B" },
        { l: "Bài 6", q: "Súng tiểu liên AK trang bị cho ai?", opts: { A: "Chỉ trang bị cho sĩ quan", B: "Từng người sử dụng", C: "Tổ 3 người sử dụng", D: "Trang bị cho cấp tiểu đội dùng chung" }, a: "B" },
        { l: "Bài 6", q: "Súng AK có thể tiêu diệt sinh lực địch bằng cách nào?", opts: { A: "Chỉ bằng hỏa lực", B: "Bằng hỏa lực, lưỡi lê và báng súng", C: "Chỉ dùng để bắn tỉa", D: "Bằng cách phóng lựu đạn" }, a: "B" },
        { l: "Bài 6", q: "Tầm bắn ghi trên thước ngắm của súng tiểu liên AK là bao nhiêu?", opts: { A: "500m", B: "800m (hoặc 1000m tùy phiên bản)", C: "1500m", D: "2000m" }, a: "B" },
        { l: "Bài 6", q: "Tầm bắn hiệu quả của súng tiểu liên AK là bao nhiêu?", opts: { A: "300m", B: "400m", C: "500m", D: "800m" }, a: "B" },
        { l: "Bài 6", q: "Sơ tốc đầu đạn của súng tiểu liên AK là bao nhiêu?", opts: { A: "715 m/s", B: "820 m/s", C: "900 m/s", D: "1000 m/s" }, a: "A" },
        { l: "Bài 6", q: "Tốc độ bắn lý thuyết của súng AK là bao nhiêu phát/phút?", opts: { A: "100 phát/phút", B: "400 phát/phút", C: "600 phát/phút", D: "800 phát/phút" }, a: "C" },
        { l: "Bài 6", q: "Tốc độ bắn thực tế ở chế độ liên thanh của súng AK là bao nhiêu phát/phút?", opts: { A: "40 phát/phút", B: "100 phát/phút", C: "200 phát/phút", D: "600 phát/phút" }, a: "B" },
        { l: "Bài 6", q: "Tốc độ bắn thực tế ở chế độ phát một của súng AK là bao nhiêu phát/phút?", opts: { A: "40 phát/phút", B: "60 phát/phút", C: "100 phát/phút", D: "120 phát/phút" }, a: "A" },
        { l: "Bài 6", q: "Trọng lượng của súng AK (không có đạn) là khoảng bao nhiêu?", opts: { A: "3,1 kg (AKM) / 3,8 kg (AK-47)", B: "4,5 kg", C: "2,5 kg", D: "5,0 kg" }, a: "A" },
        { l: "Bài 6", q: "Hộp tiếp đạn của súng AK chứa được bao nhiêu viên đạn?", opts: { A: "20 viên", B: "30 viên", C: "40 viên", D: "45 viên" }, a: "B" },
        { l: "Bài 6", q: "Súng tiểu liên AK có bao nhiêu bộ phận chính?", opts: { A: "9 bộ phận", B: "10 bộ phận", C: "11 bộ phận", D: "12 bộ phận" }, a: "C" },
        { l: "Bài 6", q: "Bộ phận nào của súng AK dùng để định hướng bay cho đầu đạn?", opts: { A: "Hộp khóa nòng", B: "Nòng súng", C: "Bộ phận ngắm", D: "Bệ khóa nòng" }, a: "B" },
        { l: "Bài 6", q: "Bộ phận nào của súng AK dùng để ngắm bắn vào các mục tiêu ở cự ly khác nhau?", opts: { A: "Bộ phận ngắm", B: "Khóa nòng", C: "Bệ khóa nòng", D: "Thoi đẩy" }, a: "A" },
        { l: "Bài 6", q: "Chế độ bắn chủ yếu của súng tiểu liên AK là gì?", opts: { A: "Bắn phát một", B: "Bắn liên thanh", C: "Bắn tỉa", D: "Bắn găm" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ là gì?", opts: { A: "Chất rắn không cháy", B: "Hóa chất phát sáng", C: "Chất hoặc hỗn hợp chất, khi bị kích thích sẽ sinh ra phản ứng nổ", D: "Một loại khí độc" }, a: "C" },
        { l: "Bài 6", q: "Thuốc nổ TNT có màu gì?", opts: { A: "Màu trắng", B: "Màu đen", C: "Màu vàng nhạt", D: "Màu xanh dương" }, a: "C" },
        { l: "Bài 6", q: "Tính chất nào sau đây là của thuốc nổ TNT?", opts: { A: "Rất nhạy nổ với va đập", B: "Kém nhạy nổ với va đập, cọ xát", C: "Dễ tan trong nước", D: "Tự bốc cháy ở nhiệt độ phòng" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ TNT nóng chảy ở nhiệt độ bao nhiêu?", opts: { A: "50 °C", B: "81 °C", C: "100 °C", D: "310 °C" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ C4 có hình dạng và màu sắc như thế nào?", opts: { A: "Dạng bột đen", B: "Dạng tinh thể vàng", C: "Dẻo, màu trắng đục", D: "Dạng lỏng màu đỏ" }, a: "C" },
        { l: "Bài 6", q: "So với TNT, độ nhạy nổ với va đập của thuốc nổ C4 như thế nào?", opts: { A: "Nhạy hơn rất nhiều", B: "Tương đương", C: "Kém nhạy hơn, an toàn hơn", D: "Không nổ khi va đập" }, a: "C" },
        { l: "Bài 6", q: "Thuốc nổ C4 có tan trong nước không?", opts: { A: "Tan rất nhanh", B: "Không tan trong nước", C: "Chỉ tan trong nước nóng", D: "Tạo thành axit khi gặp nước" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ đen (thuốc phóng) có thành phần cấu tạo chủ yếu gồm những gì?", opts: { A: "Nitroglycerin và Cồn", B: "Diêm tiêu, than củi, lưu huỳnh", C: "Axit Nitric và Amoniac", D: "Nhựa đường và Xăng" }, a: "B" },
        { l: "Bài 6", q: "Đặc điểm của thuốc nổ Amonit là gì?", opts: { A: "Màu trắng ngà, dễ hút ẩm, dễ vón cục", B: "Màu đen, cứng như đá", C: "Dạng dẻo, không sợ nước", D: "Dạng khí" }, a: "A" },
        { l: "Bài 6", q: "Vật cản là gì?", opts: { A: "Các loại xe tăng, thiết giáp", B: "Những vật thể tự nhiên hoặc nhân tạo dùng để cản trở sự cơ động của địch", C: "Các trạm radar", D: "Vũ khí hạt nhân" }, a: "B" },
        { l: "Bài 6", q: "Vật cản được chia làm mấy loại chính?", opts: { A: "2 loại: tự nhiên và nhân tạo", B: "3 loại: trên không, trên bộ, dưới nước", C: "2 loại: của ta và của địch", D: "Chỉ có 1 loại" }, a: "A" },
        { l: "Bài 6", q: "Các vật thể như sông, suối, đầm lầy, vách núi được gọi là gì?", opts: { A: "Vật cản nổ", B: "Vật cản không nổ", C: "Vật cản tự nhiên", D: "Vật cản nhân tạo" }, a: "C" },
        { l: "Bài 6", q: "Vật cản nhân tạo được chia thành những loại nào?", opts: { A: "Vật cản sắt và gỗ", B: "Vật cản nổ và không nổ", C: "Vật cản bộ binh và máy bay", D: "Vật cản điện và từ" }, a: "B" },
        { l: "Bài 6", q: "Ví dụ nào sau đây thuộc nhóm vật cản nổ?", opts: { A: "Hàng rào thép gai", B: "Hào chống tăng", C: "Bãi mìn, lựu đạn gài", D: "Hố chông" }, a: "C" },
        { l: "Bài 6", q: "Ví dụ nào sau đây thuộc nhóm vật cản KHÔNG nổ?", opts: { A: "Mìn chống tăng", B: "Lượng nổ lõm", C: "Hàng rào thép gai, chông, rào bùng nhùng", D: "Bom nổ chậm" }, a: "C" },
        { l: "Bài 6", q: "Vũ khí tự tạo là gì?", opts: { A: "Vũ khí mua từ nước ngoài", B: "Vũ khí do lực lượng vũ trang hoặc nhân dân tự chế tạo", C: "Vũ khí dùng AI", D: "Súng trường tiêu chuẩn" }, a: "B" },
        { l: "Bài 6", q: "Các loại vũ khí như chông, mìn, cạm bẫy thường được xếp vào nhóm nào?", opts: { A: "Vũ khí hủy diệt hàng loạt", B: "Vũ khí tự tạo / vật cản", C: "Vũ khí hạt nhân", D: "Vũ khí sinh học" }, a: "B" },
        { l: "Bài 6", q: "Tác dụng của việc sử dụng vũ khí tự tạo trong chiến tranh nhân dân là gì?", opts: { A: "Tiêu diệt máy bay chiến lược", B: "Thay thế hoàn toàn súng đạn", C: "Tiêu hao sinh lực địch, gây hoang mang, cản trở cơ động", D: "Đánh chặn tên lửa" }, a: "C" }
    ];

    const quizContainer = document.getElementById("quiz-container");
    const scoreEl = document.getElementById("score");
    const answeredCountEl = document.getElementById("answered-count");
    const progressBar = document.getElementById("progress-bar");
    const totalQuestionsEl = document.getElementById("total-questions");
    const completionModal = document.getElementById("completion-modal");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");

    let currentScore = 0;
    let answeredQuestions = 0;
    const totalQuestions = questions.length;

    totalQuestionsEl.innerText = totalQuestions;

    // Sinh HTML các câu hỏi
    function renderQuiz() {
        let html = '';
        questions.forEach((q, i) => {
            html += `
            <div class="question-card" id="qCard_${i}">
                <div class="lesson-badge">${q.l}</div>
                <div class="question-text">Câu ${i + 1}: ${q.q}</div>
                <div class="options-grid">
            `;
            for (const [key, value] of Object.entries(q.opts)) {
                html += `
                    <label class="option-label" id="lbl_${i}_${key}">
                        <input type="radio" name="q${i}" value="${key}" onclick="handleAnswer(${i}, '${key}')">
                        <div class="radio-custom"></div>
                        <span><strong>${key}.</strong> ${value}</span>
                        <span class="icon-result"></span>
                    </label>
                `;
            }
            html += `</div></div>`;
        });
        quizContainer.innerHTML = html;
    }

    // Xử lý khi người dùng click chọn 1 đáp án
    function handleAnswer(qIndex, selectedKey) {
        const q = questions[qIndex];
        const correctKey = q.a;
        
        // Vô hiệu hóa tất cả các lựa chọn của câu này
        const labels = document.querySelectorAll(`label[id^="lbl_${qIndex}_"]`);
        const radios = document.querySelectorAll(`input[name="q${qIndex}"]`);
        
        labels.forEach(lbl => lbl.classList.add('disabled'));
        radios.forEach(radio => radio.disabled = true);

        // Kiểm tra đúng / sai
        const selectedLabel = document.getElementById(`lbl_${qIndex}_${selectedKey}`);
        const correctLabel = document.getElementById(`lbl_${qIndex}_${correctKey}`);

        if (selectedKey === correctKey) {
            // Trả lời ĐÚNG
            selectedLabel.classList.add('correct');
            selectedLabel.querySelector('.icon-result').innerText = '✔️';
            currentScore++;
        } else {
            // Trả lời SAI
            selectedLabel.classList.add('wrong');
            selectedLabel.querySelector('.icon-result').innerText = '❌';
            
            // Hiển thị đáp án đúng
            correctLabel.classList.add('show-correct');
            correctLabel.querySelector('.icon-result').innerText = '✔️';
        }

        // Cập nhật thống kê
        answeredQuestions++;
        scoreEl.innerText = currentScore;
        answeredCountEl.innerText = answeredQuestions;
        progressBar.style.width = (answeredQuestions / totalQuestions * 100) + '%';

        // Tự động cuộn xuống câu tiếp theo (nếu mượt)
        const nextCard = document.getElementById(`qCard_${qIndex + 1}`);
        if (nextCard) {
            setTimeout(() => {
                nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 600);
        }

        // Kiểm tra xem đã hoàn thành chưa
        if (answeredQuestions === totalQuestions) {
            showCompletion();
        }
    }

    function showCompletion() {
        completionModal.style.display = 'block';
        finalScore.innerText = `${currentScore}/${totalQuestions}`;
        
        const percent = currentScore / totalQuestions;
        if (percent >= 0.8) {
            finalMessage.innerText = "Tuyệt vời! Kiến thức của bạn rất vững chắc.";
        } else if (percent >= 0.5) {
            finalMessage.innerText = "Khá tốt! Bạn đã nắm được nội dung cơ bản.";
        } else {
            finalMessage.innerText = "Cố gắng ôn tập thêm các nội dung trong SGK nhé!";
        }

        setTimeout(() => {
            completionModal.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 1000);
    }

    // Khởi tạo
    renderQuiz();
</script>

</body>
</html>
