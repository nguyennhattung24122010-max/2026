<!DOCTYPE html>
<html lang="vi">
<head>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Quicksand', sans-serif;

            background-attachment: fixed;

            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.92);

            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);

            background: linear-gradient(45deg, #6a11cb, #2575fc);

            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h3.subtitle {
            text-align: center;
            color: #636e72;
            font-weight: 600;

            display: inline-block;
            width: 100%;

            padding: 25px;

        }
        .question {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3436;
        }
        .answers label {
            display: block;
            background: #f8f9fa;
            padding: 12px 20px;
            margin-bottom: 12px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #4a4a4a;
        }
        .answers label:hover {
            background: #f3e9ff;
            border: 2px solid #dcb0ff;
            transform: scale(1.01);
            color: #6a11cb;
        }
        input[type="radio"] {
            margin-right: 12px;
            accent-color: #6a11cb;
            transform: scale(1.2);
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 40px;
            box-shadow: 0 6px 15px rgba(37, 117, 252, 0.4);

            background: linear-gradient(45deg, #5c0fba, #1e63d8);
        }
        #result-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            border-radius: 15px;

            font-weight: bold;
            color: #fff;

            border-color: #28a745 !important;
            color: #155724 !important;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);

        .wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;

        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Tin Học Ứng Dụng 11 ✨</h1>
        <h3 class="subtitle">📚 Bài 19 - 22 | 50 Câu Chuyên Sâu Về CSDL & SQL</h3>
        
        <div id="quiz"></div>
        
        <button id="submit-btn">🚀 Nộp bài & Nhận kết quả</button>
        <div id="result-container"></div>
    </div>

    <script>
        const myQuestions = [
            // Bài 19 & Khái quát CSDL
            { question: "Câu 1: Một trong những công việc thường gặp nhất trong xử lí thông tin của một bài toán quản lí là gì?", answers: { a: "Sắp xếp phần cứng máy tính.", b: "Lập trình web.", c: "Tạo lập, cập nhật, tìm kiếm và kết xuất thông tin.", d: "Cài đặt hệ điều hành." }, correctAnswer: "c" },
            { question: "Câu 2: Cơ sở dữ liệu (Database) được định nghĩa cơ bản là gì?", answers: { a: "Một tập hợp các tệp văn bản lưu trên USB.", b: "Tập hợp các dữ liệu có liên quan với nhau, được lưu trữ trên máy tính.", c: "Một phần mềm dùng để soạn thảo văn bản.", d: "Máy chủ cung cấp dịch vụ mạng." }, correctAnswer: "b" },
            { question: "Câu 3: Hệ quản trị cơ sở dữ liệu (DBMS) là gì?", answers: { a: "Là phần cứng chuyên dụng lưu trữ dữ liệu.", b: "Là phần mềm cung cấp môi trường thuận lợi và hiệu quả để tạo lập, lưu trữ và khai thác thông tin của CSDL.", c: "Là ngôn ngữ lập trình tạo ra CSDL.", d: "Là trình duyệt web để xem CSDL." }, correctAnswer: "b" },
            { question: "Câu 4: Quá trình 'Cập nhật dữ liệu' trong bài toán quản lí bao gồm những thao tác nào?", answers: { a: "Chỉ thêm dữ liệu mới.", b: "Tìm kiếm và in báo cáo.", c: "Thêm, sửa, xóa dữ liệu.", d: "Sắp xếp dữ liệu theo vần A-Z." }, correctAnswer: "c" },
            { question: "Câu 5: 'Kết xuất thông tin' từ CSDL KHÔNG bao gồm công việc nào dưới đây?", answers: { a: "Tìm kiếm các bản ghi thỏa mãn điều kiện.", b: "Lập báo cáo, thống kê.", c: "Xóa toàn bộ CSDL.", d: "In dữ liệu ra giấy." }, correctAnswer: "c" },
            
            // Bài 20: Hệ quản trị CSDL HeidiSQL, tạo lập CSDL
            { question: "Câu 6: Phần mềm HeidiSQL là gì?", answers: { a: "Hệ điều hành cho máy chủ.", b: "Phần mềm đồ họa mã nguồn mở dùng để quản trị CSDL MySQL, MariaDB...", c: "Ngôn ngữ lập trình CSDL.", d: "Phần mềm bảo mật dữ liệu." }, correctAnswer: "b" },
            { question: "Câu 7: Trong HeidiSQL, để tạo một CSDL mới ta thực hiện thao tác nào?", answers: { a: "Vào menu Edit -> New Database.", b: "Nháy đúp chuột vào màn hình chính.", c: "Nháy chuột phải ở vùng danh sách CSDL bên trái -> Tạo mới (Create new) -> Cơ sở dữ liệu (Database).", d: "Bấm tổ hợp Ctrl + N." }, correctAnswer: "c" },
            { question: "Câu 8: Kiểu dữ liệu INT trong MySQL/HeidiSQL được dùng để lưu trữ gì?", answers: { a: "Số thực.", b: "Số nguyên.", c: "Kí tự văn bản.", d: "Thời gian." }, correctAnswer: "b" },
            { question: "Câu 9: Để lưu trữ chuỗi kí tự có độ dài biến đổi (ví dụ: Họ và tên), ta dùng kiểu dữ liệu nào?", answers: { a: "INT", b: "DATE", c: "VARCHAR", d: "FLOAT" }, correctAnswer: "c" },
            { question: "Câu 10: Kiểu dữ liệu DATE dùng để lưu thông tin gì?", answers: { a: "Ngày tháng năm.", b: "Giờ phút giây.", c: "Đoạn văn bản dài.", d: "Số thập phân." }, correctAnswer: "a" },
            { question: "Câu 11: Thuộc tính AUTO_INCREMENT trong định nghĩa cột có ý nghĩa gì?", answers: { a: "Không cho phép nhập giá trị Null.", b: "Tự động tăng giá trị lên 1 mỗi khi thêm bản ghi mới (thường dùng cho khóa chính).", c: "Tự động sắp xếp cột theo A-Z.", d: "Tự động xóa bản ghi nếu bị lỗi." }, correctAnswer: "b" },
            { question: "Câu 12: Tại cửa sổ cấu trúc bảng của HeidiSQL, mục 'Not null' nếu được tích chọn có nghĩa là gì?", answers: { a: "Trường này chỉ nhận số 0.", b: "Trường này bắt buộc phải có giá trị, không được để trống.", c: "Trường này là khóa ngoài.", d: "Trường này có thể để trống." }, correctAnswer: "b" },
            { question: "Câu 13: Để đổi tên một bảng trong HeidiSQL, ta có thể dùng phím tắt nào sau khi chọn bảng đó?", answers: { a: "F1", b: "F2", c: "F3", d: "F5" }, correctAnswer: "b" },
            { question: "Câu 14: Để xem toàn bộ dữ liệu đang có trong một bảng trên HeidiSQL, ta chuyển sang thẻ (tab) nào?", answers: { a: "Cấu trúc (Table/Structure).", b: "Dữ liệu (Data).", c: "Khóa ngoài (Foreign keys).", d: "Chỉ mục (Indexes)." }, correctAnswer: "b" },
            { question: "Câu 15: Tại sao chúng ta cần sao lưu (Backup) CSDL?", answers: { a: "Để làm cho CSDL chạy nhanh hơn.", b: "Phòng ngừa rủi ro mất mát dữ liệu do sự cố phần cứng, phần mềm hoặc thao tác sai.", c: "Để mã hóa dữ liệu.", d: "Để tự động tạo bảng mới." }, correctAnswer: "b" },
            { question: "Câu 16: Trong HeidiSQL, thao tác xuất (sao lưu) CSDL sẽ tạo ra tệp có phần mở rộng mặc định là gì?", answers: { a: ".doc", b: ".xls", c: ".txt", d: ".sql" }, correctAnswer: "d" },
            { question: "Câu 17: Để tạo khóa chính (Primary Key) cho một trường trong HeidiSQL, ta nháy chuột phải vào trường đó và chọn gì?", answers: { a: "Tạo chỉ mục mới (Create new index) -> Khóa ngoài (Foreign key)", b: "Tạo chỉ mục mới (Create new index) -> Khóa chính (PRIMARY)", c: "Chèn cột mới (Insert column)", d: "Xóa cột (Drop column)" }, correctAnswer: "b" },
            
            // Bài 21: CSDL Quan hệ (Bảng, Khóa chính, Khóa ngoài)
            { question: "Câu 18: Mô hình dữ liệu quan hệ tổ chức dữ liệu dưới dạng nào?", answers: { a: "Dạng sơ đồ cây.", b: "Dạng đồ thị.", c: "Các bảng (Table) có mối quan hệ với nhau.", d: "Danh sách liên kết." }, correctAnswer: "c" },
            { question: "Câu 19: Mỗi cột trong bảng CSDL quan hệ còn được gọi là gì?", answers: { a: "Bản ghi (Record).", b: "Trường (Field / Attribute).", c: "Khóa (Key).", d: "Quan hệ (Relation)." }, correctAnswer: "b" },
            { question: "Câu 20: Mỗi hàng trong bảng biểu diễn điều gì?", answers: { a: "Một thuộc tính của đối tượng.", b: "Cấu trúc của bảng.", c: "Một bản ghi (Record) chứa thông tin cụ thể về một đối tượng.", d: "Một kiểu dữ liệu." }, correctAnswer: "c" },
            { question: "Câu 21: Khóa chính (Primary Key) của một bảng mang đặc điểm gì?", answers: { a: "Có thể để trống (Null).", b: "Giá trị của khóa chính có thể trùng lặp.", c: "Phân biệt duy nhất mỗi bản ghi trong bảng và không được để trống.", d: "Mỗi bảng có thể có nhiều khóa chính độc lập." }, correctAnswer: "c" },
            { question: "Câu 22: Có thể dùng sự kết hợp của nhiều cột để làm khóa chính được không?", answers: { a: "Không, khóa chính chỉ được phép là 1 cột.", b: "Có, được gọi là khóa chính phức hợp.", c: "Chỉ được khi dữ liệu là số.", d: "Chỉ được đối với khóa ngoài." }, correctAnswer: "b" },
            { question: "Câu 23: Mục đích của Khóa ngoài (Foreign Key) là gì?", answers: { a: "Dùng để đánh chỉ mục tìm kiếm cho nhanh.", b: "Thiết lập mối liên kết (quan hệ) giữa hai bảng với nhau.", c: "Thay thế cho khóa chính khi bảng bị lỗi.", d: "Tự động tính toán dữ liệu." }, correctAnswer: "b" },
            { question: "Câu 24: Ràng buộc toàn vẹn tham chiếu (Foreign Key Constraint) đảm bảo điều gì?", answers: { a: "Không cho phép nhập giá trị vào trường khóa ngoài nếu giá trị đó không tồn tại ở khóa chính của bảng tham chiếu.", b: "Hai bảng liên kết phải có cùng số lượng bản ghi.", c: "Tên các cột trong hai bảng phải hoàn toàn giống nhau.", d: "Không thể thêm dữ liệu vào bảng chính." }, correctAnswer: "a" },
            { question: "Câu 25: Khi khai báo khóa ngoài, hai trường dùng để liên kết giữa bảng con và bảng cha cần có sự đồng nhất về yếu tố nào nhất?", answers: { a: "Cùng tên cột.", b: "Cùng độ rộng hiển thị.", c: "Cùng kiểu dữ liệu.", d: "Cùng thuộc tính Auto_increment." }, correctAnswer: "c" },
            { question: "Câu 26: Nếu CSDL thiết lập ràng buộc tham chiếu nghiêm ngặt, khi cố tình XÓA một bản ghi ở bảng cha mà bản ghi đó đang được tham chiếu bởi bảng con, hệ thống sẽ làm gì?", answers: { a: "Tự động xóa luôn dữ liệu ở bảng con.", b: "Báo lỗi vi phạm khóa ngoại và từ chối xóa.", c: "Chuyển khóa ngoại ở bảng con thành Null.", d: "Vẫn xóa bình thường." }, correctAnswer: "b" },
            { question: "Câu 27: Khi nhập liệu vào các bảng có quan hệ với nhau qua khóa chính - khóa ngoài, ta phải tuân theo thứ tự nào?", answers: { a: "Nhập bảng có khóa ngoài (bảng con) trước.", b: "Nhập bảng nào trước cũng được.", c: "Nhập bảng có khóa chính (bảng cha) trước.", d: "Nhập cả 2 bảng cùng lúc." }, correctAnswer: "c" },
            { question: "Câu 28: Hệ quản trị CSDL nào sau đây thuộc loại HQTCSDL quan hệ?", answers: { a: "MongoDB", b: "MySQL", c: "Redis", d: "Neo4j" }, correctAnswer: "b" },
            { question: "Câu 29: Trong bài toán thư viện, bảng 'Mượn Trả' lấy 'Mã thẻ' từ bảng 'Bạn Đọc' để lưu người mượn. 'Mã thẻ' trong bảng 'Mượn Trả' gọi là gì?", answers: { a: "Khóa chính.", b: "Khóa ngoài.", c: "Khóa ảo.", d: "Bản ghi." }, correctAnswer: "b" },

            // Bài 22: Truy vấn dữ liệu với SQL
            { question: "Câu 30: SQL là viết tắt của cụm từ tiếng Anh nào?", answers: { a: "Standard Question Language", b: "Structured Query Language", c: "System Query Logic", d: "Simple Query Language" }, correctAnswer: "b" },
            { question: "Câu 31: Lệnh SQL nào dùng để LẤY / TRUY XUẤT dữ liệu từ CSDL?", answers: { a: "GET", b: "PULL", c: "SELECT", d: "EXTRACT" }, correctAnswer: "c" },
            { question: "Câu 32: Từ khóa nào đi kèm với SELECT dùng để chỉ định bảng muốn lấy dữ liệu?", answers: { a: "WHERE", b: "FROM", c: "TABLE", d: "IN" }, correctAnswer: "b" },
            { question: "Câu 33: Mệnh đề nào dùng để thiết lập ĐIỀU KIỆN lọc các bản ghi trong lệnh SELECT, UPDATE, DELETE?", answers: { a: "FILTER", b: "IF", c: "WHERE", d: "CONDITION" }, correctAnswer: "c" },
            { question: "Câu 34: Câu lệnh `SELECT * FROM hocsinh;` mang ý nghĩa gì?", answers: { a: "Lấy tất cả các cột và bản ghi từ bảng hocsinh.", b: "Tính tổng số bản ghi trong bảng hocsinh.", c: "Xóa toàn bộ bảng hocsinh.", d: "Sao chép bảng hocsinh." }, correctAnswer: "a" },
            { question: "Câu 35: Để chỉ lấy cột 'HoTen' và 'Diem' từ bảng 'HocSinh', ta viết lệnh nào?", answers: { a: "SELECT HoTen, Diem FROM HocSinh;", b: "SELECT * FROM HocSinh WHERE HoTen, Diem;", c: "SELECT HocSinh FROM HoTen, Diem;", d: "GET HoTen, Diem FROM HocSinh;" }, correctAnswer: "a" },
            { question: "Câu 36: Lệnh SQL nào dùng để THÊM một bản ghi mới vào bảng?", answers: { a: "ADD RECORD", b: "CREATE ROW", c: "INSERT INTO", d: "UPDATE" }, correctAnswer: "c" },
            { question: "Câu 37: Cú pháp cơ bản nào sau đây đúng đối với lệnh INSERT?", answers: { a: "INSERT (giá trị 1, giá trị 2) INTO Tên_bảng;", b: "INSERT INTO Tên_bảng (Cột 1, Cột 2) VALUES (giá trị 1, giá trị 2);", c: "INSERT VALUES (giá trị 1) TO Tên_bảng;", d: "ADD INTO Tên_bảng (Cột 1) VALUES (giá trị 1);" }, correctAnswer: "b" },
            { question: "Câu 38: Khi làm việc với chuỗi kí tự (Varchar) trong lệnh SQL, giá trị chuỗi phải được đặt trong dấu gì?", answers: { a: "Dấu ngoặc vuông [ ]", b: "Dấu ngoặc nhọn { }", c: "Dấu nháy đơn ' ' (hoặc nháy kép \" \")", d: "Không cần dấu gì" }, correctAnswer: "c" },
            { question: "Câu 39: Lệnh SQL nào dùng để SỬA / CẬP NHẬT dữ liệu đã có trong bảng?", answers: { a: "CHANGE", b: "MODIFY", c: "UPDATE", d: "ALTER" }, correctAnswer: "c" },
            { question: "Câu 40: Nếu chạy lệnh `UPDATE HocSinh SET Diem = 10;` (KHÔNG CÓ mệnh đề WHERE), điều gì sẽ xảy ra?", answers: { a: "Báo lỗi và không chạy.", b: "Hệ thống hỏi xác nhận bản ghi nào.", c: "Tất cả học sinh trong bảng đều được cập nhật Diem = 10.", d: "Chỉ bản ghi đầu tiên được cập nhật." }, correctAnswer: "c" },
            { question: "Câu 41: Lệnh SQL nào dùng để XÓA các bản ghi khỏi bảng?", answers: { a: "DELETE FROM", b: "DROP TABLE", c: "REMOVE", d: "CLEAR" }, correctAnswer: "a" },
            { question: "Câu 42: Lệnh `DROP TABLE HocSinh;` khác gì so với `DELETE FROM HocSinh;`?", answers: { a: "Giống nhau hoàn toàn.", b: "DROP xóa cấu trúc bảng (mất luôn bảng), DELETE chỉ xóa dữ liệu bên trong bảng.", c: "DELETE xóa cấu trúc bảng, DROP xóa dữ liệu.", d: "DROP chỉ dùng cho khóa ngoài." }, correctAnswer: "b" },
            { question: "Câu 43: Để lấy dữ liệu của những học sinh có điểm lớn hơn 8, mệnh đề WHERE được viết như thế nào?", answers: { a: "WHERE Diem => 8", b: "WHERE Diem > 8", c: "WHERE Diem >< 8", d: "WHERE 8 < Diem > 10" }, correctAnswer: "b" },
            { question: "Câu 44: Toán tử nào trong SQL dùng để kiểm tra sự KHÁC NHAU (không bằng)?", answers: { a: "==", b: "<> hoặc !=", c: "><", d: "NOT" }, correctAnswer: "b" },
            { question: "Câu 45: Từ khóa JOIN (như INNER JOIN) trong câu lệnh SELECT dùng để làm gì?", answers: { a: "Nối hai chuỗi kí tự lại với nhau.", b: "Sắp xếp dữ liệu.", c: "Truy vấn và kết nối dữ liệu từ 2 hoặc nhiều bảng dựa trên khóa liên kết.", d: "Gộp 2 CSDL thành 1." }, correctAnswer: "c" },
            { question: "Câu 46: Toán tử LIKE cùng với kí tự '%' trong lệnh `WHERE HoTen LIKE 'Nguyễn%'` có tác dụng gì?", answers: { a: "Tìm những người có chữ 'Nguyễn' ở cuối tên.", b: "Tìm những người họ 'Nguyễn' (bắt đầu bằng chuỗi 'Nguyễn').", c: "Tìm những người có chữ 'Nguyễn' ở bất kì vị trí nào.", d: "Xóa những người họ 'Nguyễn'." }, correctAnswer: "b" },
            { question: "Câu 47: Câu lệnh nào dùng để sắp xếp kết quả truy vấn tăng dần hoặc giảm dần?", answers: { a: "SORT BY", b: "GROUP BY", c: "ORDER BY", d: "ALIGN BY" }, correctAnswer: "c" },
            { question: "Câu 48: Để truy xuất kết quả và sắp xếp giảm dần, ta thêm từ khóa nào sau ORDER BY?", answers: { a: "ASC", b: "DESC", c: "DOWN", d: "REVERSE" }, correctAnswer: "b" },
            { question: "Câu 49: Trong giao diện viết SQL (Query) của HeidiSQL, phím tắt phổ biến nhất để thực thi (chạy) câu lệnh SQL là phím nào?", answers: { a: "F9", b: "F5", c: "Enter", d: "Ctrl + S" }, correctAnswer: "a" },
            { question: "Câu 50: Nhóm lệnh SQL gồm (INSERT, UPDATE, DELETE) được gọi chung là thao tác gì trên CSDL?", answers: { a: "Khai báo cấu trúc.", b: "Cập nhật dữ liệu.", c: "Phân quyền bảo mật.", d: "Kiểm tra toàn vẹn." }, correctAnswer: "b" }
        ];

        const quizContainer = document.getElementById('quiz');
        const submitButton = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');

        function buildQuiz() {
            const output = [];

            myQuestions.forEach((currentQuestion, questionNumber) => {
                const answers = [];
                for (let letter in currentQuestion.answers) {
                    answers.push(
                        `<label id="label_${questionNumber}_${letter}">
                            <input type="radio" name="question${questionNumber}" value="${letter}">
                            ${letter.toUpperCase()}. ${currentQuestion.answers[letter]}
                        </label>`
                    );
                }

                output.push(
                    `<div class="question-card" id="q-card-${questionNumber}">
                        <div class="question">${currentQuestion.question}</div>
                        <div class="answers">${answers.join('')}</div>
                    </div>`
                );
            });

            quizContainer.innerHTML = output.join('');
        }

        function showResults() {
            let numCorrect = 0;

            myQuestions.forEach((currentQuestion, questionNumber) => {
                const answerContainer = document.getElementById(`q-card-${questionNumber}`);
                const selector = `input[name=question${questionNumber}]:checked`;
                const userAnswer = (answerContainer.querySelector(selector) || {}).value;

                for(let letter in currentQuestion.answers) {
                    document.getElementById(`label_${questionNumber}_${letter}`).classList.remove('correct', 'wrong');
                }

                if (userAnswer === currentQuestion.correctAnswer) {
                    numCorrect++;
                    document.getElementById(`label_${questionNumber}_${userAnswer}`).classList.add('correct');
                } else {
                    if (userAnswer) {
                        document.getElementById(`label_${questionNumber}_${userAnswer}`).classList.add('wrong');
                    }
                    document.getElementById(`label_${questionNumber}_${currentQuestion.correctAnswer}`).classList.add('correct');
                }
            });

            const scorePercent = (numCorrect / myQuestions.length) * 10;
            
            let message = "";
            if (scorePercent === 10) message = "🎉 Quá đỉnh! Không hổ danh là Lọ thánh chí tôn!";
            else if (scorePercent >= 8) message = "🔥 Cực giỏi! Tổng tài của tôi đúng là xuất chúng!";
            else if (scorePercent >= 5) message = "👍 Rất khá! Ôn lại SQL một chút là hoàn hảo!";
            else message = "💪 Cố lên nhé tổng tài, vạn sự khởi đầu nan!";

            resultContainer.innerHTML = `Đã chấm xong!<br>Đúng ${numCorrect} / ${myQuestions.length} câu.<br><br>Điểm số: ${scorePercent.toFixed(1)} / 10<br>${message}`;
            resultContainer.style.display = 'block';
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        buildQuiz();
        submitButton.addEventListener('click', showResults);
    </script>
</body>
</html>
