        const quizContainer = document.getElementById('quiz');
        const submitButton = document.getElementById('submit-btn');
        const resultContainer = document.getElementById('result-container');

        function buildQuiz() {
            const output = [];

            myQuestions.forEach((currentQuestion, questionNumber) => {
                const answers = [];
                for (let letter in currentQuestion.answers) {
                    answers.push(
                        `<label id="label_${questionNumber}_${letter}">
                            <input type="radio" name="question${questionNumber}" value="${letter}">
                            ${letter.toUpperCase()}. ${currentQuestion.answers[letter]}
                        </label>`
                    );
                }

                output.push(
                    `<div class="question-card" id="q-card-${questionNumber}">
                        <div class="question">${currentQuestion.question}</div>
                        <div class="answers">${answers.join('')}</div>
                    </div>`
                );
            });

            quizContainer.innerHTML = output.join('');
        }

        function showResults() {
            let numCorrect = 0;

            myQuestions.forEach((currentQuestion, questionNumber) => {
                const answerContainer = document.getElementById(`q-card-${questionNumber}`);
                const selector = `input[name=question${questionNumber}]:checked`;
                const userAnswer = (answerContainer.querySelector(selector) || {}).value;

                // Reset styles
                for(let letter in currentQuestion.answers) {
                    document.getElementById(`label_${questionNumber}_${letter}`).classList.remove('correct', 'wrong');
                }

                if (userAnswer === currentQuestion.correctAnswer) {
                    numCorrect++;
                    document.getElementById(`label_${questionNumber}_${userAnswer}`).classList.add('correct');
                } else {
                    if (userAnswer) {
                        document.getElementById(`label_${questionNumber}_${userAnswer}`).classList.add('wrong');
                    }
                    // Show the correct answer
                    document.getElementById(`label_${questionNumber}_${currentQuestion.correctAnswer}`).classList.add('correct');
                }
            });

            const scorePercent = (numCorrect / myQuestions.length) * 10;
            resultContainer.innerHTML = `Bạn đã làm đúng ${numCorrect} / ${myQuestions.length} câu. <br> Điểm của bạn: ${scorePercent.toFixed(1)} điểm.`;
            resultContainer.style.display = 'block';
            
            // Scroll to bottom to see result
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Khởi tạo bài trắc nghiệm
        buildQuiz();

        // Lắng nghe sự kiện nộp bài
        submitButton.addEventListener('click', showResults);
    </script>
