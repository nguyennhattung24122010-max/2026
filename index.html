<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm GDQP&AN 11 - PRO VIP</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .header {
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progress-container {
            width: 100%;
            max-width: 800px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-top: 15px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            margin-top: 5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid var(--primary);
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #111827;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .option-label:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.3);
            accent-color: var(--primary);
        }

        /* Khi radio được chọn */
        .option-label:has(input:checked) {
            border-color: var(--primary);
            background-color: #e0e7ff;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(79, 70, 229, 0.39);
        }

        #result-board {
            display: none;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
        }

        .score-pass { background-color: var(--success); }
        .score-fail { background-color: var(--danger); }

        /* Highlight sau khi nộp */
        .correct { background-color: #d1fae5 !important; border-color: var(--success) !important; color: #065f46; }
        .wrong { background-color: #fee2e2 !important; border-color: var(--danger) !important; color: #991b1b; }
        
        .lesson-tag {
            font-size: 0.8rem;
            background: #e0e7ff;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Hệ Thống Trắc Nghiệm GDQP 11</h1>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Đã trả lời: 0/50 câu</div>
</div>

<div class="container">
    <div id="result-board">
        <h2 style="margin-top: 0;">KẾT QUẢ CỦA TỔNG TÀI</h2>
        <div class="score-circle" id="scoreCircle">0/50</div>
        <p id="scoreMessage" style="font-size: 1.2rem; font-weight: bold;"></p>
        <button class="btn-submit" onclick="location.reload()" style="padding: 10px 25px; font-size: 1rem; margin-top: 15px;">Làm Lại</button>
    </div>

    <form id="quizForm">
        <!-- Các câu hỏi sẽ được sinh ra ở đây -->
    </form>
    
    <div class="submit-container">
        <button type="button" class="btn-submit" onclick="submitQuiz()">CHỐT ĐÁP ÁN</button>
    </div>
</div>

<script>
    // BỘ 50 CÂU HỎI (15 câu Bài 2, 35 câu Bài 6)
    const questions = [
        // --- BÀI 2: Luật Nghĩa vụ quân sự và trách nhiệm ---
        { l: "Bài 2", q: "Theo Luật NVQS 2015, công dân nam đủ bao nhiêu tuổi trở lên phải đăng ký nghĩa vụ quân sự?", opts: { A: "16 tuổi", B: "17 tuổi", C: "18 tuổi", D: "19 tuổi" }, a: "B" },
        { l: "Bài 2", q: "Độ tuổi gọi nhập ngũ trong thời bình đối với công dân nam không học cao đẳng, đại học là?", opts: { A: "18 đến hết 22 tuổi", B: "18 đến hết 25 tuổi", C: "18 đến hết 27 tuổi", D: "18 đến hết 30 tuổi" }, a: "B" },
        { l: "Bài 2", q: "Công dân nam được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn thì độ tuổi gọi nhập ngũ đến hết bao nhiêu tuổi?", opts: { A: "25 tuổi", B: "26 tuổi", C: "27 tuổi", D: "28 tuổi" }, a: "C" },
        { l: "Bài 2", q: "Cơ quan nào có thẩm quyền đăng ký nghĩa vụ quân sự cho công dân cư trú tại địa phương?", opts: { A: "Công an cấp xã", B: "UBND cấp huyện", C: "Ban Chỉ huy quân sự cấp xã", D: "Hội đồng NVQS cấp tỉnh" }, a: "C" },
        { l: "Bài 2", q: "Thời gian khám sức khỏe gọi nhập ngũ và thực hiện nghĩa vụ tham gia CAND hàng năm thường diễn ra vào thời gian nào?", opts: { A: "Từ 1/1 đến 30/2", B: "Từ 1/11 đến 31/12", C: "Từ 1/5 đến 31/6", D: "Từ 1/8 đến 30/9" }, a: "B" },
        { l: "Bài 2", q: "Lễ giao nhận quân hằng năm thường được tổ chức vào khoảng thời gian nào?", opts: { A: "Tháng 2 hoặc tháng 3", B: "Tháng 11 hoặc tháng 12", C: "Tháng 5 hoặc tháng 6", D: "Tháng 8 hoặc tháng 9" }, a: "A" },
        { l: "Bài 2", q: "Hành vi nào sau đây bị nghiêm cấm trong thực hiện nghĩa vụ quân sự?", opts: { A: "Đăng ký NVQS đúng hạn", B: "Trốn tránh thực hiện NVQS", C: "Khám sức khỏe theo lệnh gọi", D: "Chấp hành lệnh gọi nhập ngũ" }, a: "B" },
        { l: "Bài 2", q: "Công dân nữ có phải thực hiện nghĩa vụ quân sự không?", opts: { A: "Bắt buộc như nam giới", B: "Hoàn toàn không được tham gia", C: "Tự nguyện tham gia nếu quân đội có nhu cầu", D: "Chỉ được làm công tác y tế" }, a: "C" },
        { l: "Bài 2", q: "Thời hạn phục vụ tại ngũ trong thời bình của hạ sĩ quan, binh sĩ là bao nhiêu tháng?", opts: { A: "12 tháng", B: "18 tháng", C: "24 tháng", D: "36 tháng" }, a: "C" },
        { l: "Bài 2", q: "Thời hạn thực hiện nghĩa vụ tham gia Công an nhân dân là bao nhiêu tháng?", opts: { A: "18 tháng", B: "24 tháng", C: "30 tháng", D: "36 tháng" }, a: "B" },
        { l: "Bài 2", q: "Đối tượng nào sau đây được TẠM HOÃN gọi nhập ngũ?", opts: { A: "Con của liệt sĩ", B: "Học sinh đang học THPT", C: "Người không đủ sức khỏe phục vụ tại ngũ", D: "Cán bộ, công chức" }, a: "B" },
        { l: "Bài 2", q: "Đối tượng nào sau đây được MIỄN gọi nhập ngũ?", opts: { A: "Sinh viên đại học", B: "Người lao động duy nhất nuôi gia đình", C: "Con của liệt sĩ, con của thương binh hạng một", D: "Học sinh giỏi cấp quốc gia" }, a: "C" },
        { l: "Bài 2", q: "Tiêu chuẩn tuyển quân thực hiện nghĩa vụ tham gia CAND bao gồm những gì?", opts: { A: "Chỉ cần đủ chiều cao và cân nặng", B: "Lý lịch rõ ràng, nghiêm chỉnh chấp hành pháp luật, đủ sức khỏe", C: "Phải là đảng viên Đảng Cộng sản Việt Nam", D: "Phải tốt nghiệp đại học trở lên" }, a: "B" },
        { l: "Bài 2", q: "Một trong những trách nhiệm của học sinh trong việc thực hiện NVQS là?", opts: { A: "Tìm mọi cách để được tạm hoãn", B: "Không cần tìm hiểu pháp luật về NVQS", C: "Học tập chính trị, quân sự; chấp hành quy định về đăng ký NVQS", D: "Tự ý bỏ học để nhập ngũ" }, a: "C" },
        { l: "Bài 2", q: "Việc xử lý công dân vi phạm pháp luật về nghĩa vụ quân sự được quy định như thế nào?", opts: { A: "Chỉ bị nhắc nhở", B: "Xử phạt hành chính hoặc truy cứu trách nhiệm hình sự", C: "Đuổi học hoặc buộc thôi việc", D: "Không bị xử lý nếu dưới 18 tuổi" }, a: "B" },

        // --- BÀI 6: Súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo ---
        { l: "Bài 6", q: "Súng tiểu liên AK do ai thiết kế?", opts: { A: "M.T. Kalashnikov", B: "Simonov", C: "Makarov", D: "Tokarev" }, a: "A" },
        { l: "Bài 6", q: "Súng tiểu liên AK (phiên bản chuẩn) ra đời vào năm nào?", opts: { A: "1943", B: "1945", C: "1947", D: "1954" }, a: "C" },
        { l: "Bài 6", q: "Cỡ đạn của súng tiểu liên AK là bao nhiêu?", opts: { A: "5,56 mm", B: "7,62 mm", C: "9 mm", D: "12,7 mm" }, a: "B" },
        { l: "Bài 6", q: "Súng tiểu liên AK trang bị cho ai?", opts: { A: "Chỉ trang bị cho sĩ quan", B: "Từng người sử dụng", C: "Tổ 3 người sử dụng", D: "Trang bị cho cấp tiểu đội dùng chung" }, a: "B" },
        { l: "Bài 6", q: "Súng AK có thể tiêu diệt sinh lực địch bằng cách nào?", opts: { A: "Chỉ bằng hỏa lực", B: "Bằng hỏa lực, lưỡi lê và báng súng", C: "Chỉ dùng để bắn tỉa", D: "Bằng cách phóng lựu đạn" }, a: "B" },
        { l: "Bài 6", q: "Tầm bắn ghi trên thước ngắm của súng tiểu liên AK là bao nhiêu?", opts: { A: "500m", B: "800m (hoặc 1000m tùy phiên bản)", C: "1500m", D: "2000m" }, a: "B" },
        { l: "Bài 6", q: "Tầm bắn hiệu quả của súng tiểu liên AK là bao nhiêu?", opts: { A: "300m", B: "400m", C: "500m", D: "800m" }, a: "B" },
        { l: "Bài 6", q: "Sơ tốc đầu đạn của súng tiểu liên AK là bao nhiêu?", opts: { A: "715 m/s", B: "820 m/s", C: "900 m/s", D: "1000 m/s" }, a: "A" },
        { l: "Bài 6", q: "Tốc độ bắn lý thuyết của súng AK là bao nhiêu phát/phút?", opts: { A: "100 phát/phút", B: "400 phát/phút", C: "600 phát/phút", D: "800 phát/phút" }, a: "C" },
        { l: "Bài 6", q: "Tốc độ bắn thực tế ở chế độ liên thanh của súng AK là bao nhiêu phát/phút?", opts: { A: "40 phát/phút", B: "100 phát/phút", C: "200 phát/phút", D: "600 phát/phút" }, a: "B" },
        { l: "Bài 6", q: "Tốc độ bắn thực tế ở chế độ phát một của súng AK là bao nhiêu phát/phút?", opts: { A: "40 phát/phút", B: "60 phát/phút", C: "100 phát/phút", D: "120 phát/phút" }, a: "A" },
        { l: "Bài 6", q: "Trọng lượng của súng AK (không có đạn) là khoảng bao nhiêu?", opts: { A: "3,1 kg (AKM) / 3,8 kg (AK-47)", B: "4,5 kg", C: "2,5 kg", D: "5,0 kg" }, a: "A" },
        { l: "Bài 6", q: "Hộp tiếp đạn của súng AK chứa được bao nhiêu viên đạn?", opts: { A: "20 viên", B: "30 viên", C: "40 viên", D: "45 viên" }, a: "B" },
        { l: "Bài 6", q: "Súng tiểu liên AK có bao nhiêu bộ phận chính?", opts: { A: "9 bộ phận", B: "10 bộ phận", C: "11 bộ phận", D: "12 bộ phận" }, a: "C" },
        { l: "Bài 6", q: "Bộ phận nào của súng AK dùng để định hướng bay cho đầu đạn?", opts: { A: "Hộp khóa nòng", B: "Nòng súng", C: "Bộ phận ngắm", D: "Bệ khóa nòng" }, a: "B" },
        { l: "Bài 6", q: "Bộ phận nào của súng AK dùng để ngắm bắn vào các mục tiêu ở cự ly khác nhau?", opts: { A: "Bộ phận ngắm", B: "Khóa nòng", C: "Bệ khóa nòng", D: "Thoi đẩy" }, a: "A" },
        { l: "Bài 6", q: "Chế độ bắn chủ yếu của súng tiểu liên AK là gì?", opts: { A: "Bắn phát một", B: "Bắn liên thanh", C: "Bắn tỉa", D: "Bắn găm" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ là gì?", opts: { A: "Chất rắn không cháy", B: "Hóa chất phát sáng", C: "Chất hoặc hỗn hợp chất hóa học, khi bị kích thích sẽ sinh ra phản ứng nổ", D: "Một loại khí độc" }, a: "C" },
        { l: "Bài 6", q: "Thuốc nổ TNT có màu gì?", opts: { A: "Màu trắng", B: "Màu đen", C: "Màu vàng nhạt", D: "Màu xanh dương" }, a: "C" },
        { l: "Bài 6", q: "Tính chất nào sau đây là của thuốc nổ TNT?", opts: { A: "Rất nhạy nổ với va đập, cọ xát", B: "Kém nhạy nổ với va đập, cọ xát", C: "Dễ tan trong nước", D: "Tự bốc cháy ở nhiệt độ phòng" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ TNT nóng chảy ở nhiệt độ bao nhiêu?", opts: { A: "50 °C", B: "81 °C", C: "100 °C", D: "310 °C" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ C4 có hình dạng và màu sắc như thế nào?", opts: { A: "Dạng bột màu đen", B: "Dạng tinh thể màu vàng", C: "Dẻo, màu trắng đục", D: "Dạng lỏng màu đỏ" }, a: "C" },
        { l: "Bài 6", q: "So với TNT, độ nhạy nổ với va đập của thuốc nổ C4 như thế nào?", opts: { A: "Nhạy hơn rất nhiều", B: "Tương đương", C: "Kém nhạy hơn, an toàn hơn", D: "Không thể nổ khi va đập" }, a: "C" },
        { l: "Bài 6", q: "Thuốc nổ C4 có tan trong nước không?", opts: { A: "Tan rất nhanh", B: "Không tan trong nước", C: "Chỉ tan trong nước nóng", D: "Tạo thành axit khi gặp nước" }, a: "B" },
        { l: "Bài 6", q: "Thuốc nổ đen (thuốc phóng) có thành phần cấu tạo chủ yếu gồm những gì?", opts: { A: "Nitroglycerin và Cồn", B: "Diêm tiêu, than củi, lưu huỳnh", C: "Axit Nitric và Amoniac", D: "Nhựa đường và Xăng" }, a: "B" },
        { l: "Bài 6", q: "Đặc điểm của thuốc nổ Amonit là gì?", opts: { A: "Màu trắng ngà, dễ hút ẩm, dễ vón cục", B: "Màu đen, cứng như đá", C: "Dạng dẻo, không sợ nước", D: "Dạng khí" }, a: "A" },
        { l: "Bài 6", q: "Vật cản là gì?", opts: { A: "Các loại xe tăng, thiết giáp", B: "Những vật thể tự nhiên hoặc nhân tạo dùng để cản trở sự cơ động của địch", C: "Các trạm radar phát sóng", D: "Vũ khí hạt nhân" }, a: "B" },
        { l: "Bài 6", q: "Vật cản được chia làm mấy loại chính?", opts: { A: "2 loại: tự nhiên và nhân tạo", B: "3 loại: trên không, trên bộ, dưới nước", C: "2 loại: của ta và của địch", D: "Chỉ có 1 loại duy nhất" }, a: "A" },
        { l: "Bài 6", q: "Các vật thể như sông, suối, đầm lầy, vách núi được gọi là gì?", opts: { A: "Vật cản nổ", B: "Vật cản không nổ", C: "Vật cản tự nhiên", D: "Vật cản nhân tạo" }, a: "C" },
        { l: "Bài 6", q: "Vật cản nhân tạo được chia thành những loại nào?", opts: { A: "Vật cản bằng sắt và bằng gỗ", B: "Vật cản nổ và vật cản không nổ", C: "Vật cản chống bộ binh và chống máy bay", D: "Vật cản điện và vật cản từ" }, a: "B" },
        { l: "Bài 6", q: "Ví dụ nào sau đây thuộc nhóm vật cản nổ?", opts: { A: "Hàng rào thép gai", B: "Hào chống tăng", C: "Bãi mìn, lựu đạn gài", D: "Hố chông" }, a: "C" },
        { l: "Bài 6", q: "Ví dụ nào sau đây thuộc nhóm vật cản KHÔNG nổ?", opts: { A: "Mìn chống tăng", B: "Lượng nổ lõm", C: "Hàng rào thép gai, chông, rào bùng nhùng", D: "Bom nổ chậm" }, a: "C" },
        { l: "Bài 6", q: "Vũ khí tự tạo là gì?", opts: { A: "Vũ khí mua từ nước ngoài", B: "Vũ khí do lực lượng vũ trang hoặc nhân dân tự chế tạo", C: "Vũ khí công nghệ cao dùng AI", D: "Súng trường tiêu chuẩn của quân đội" }, a: "B" },
        { l: "Bài 6", q: "Các loại vũ khí như chông, mìn, cạm bẫy thường được xếp vào nhóm nào?", opts: { A: "Vũ khí hủy diệt hàng loạt", B: "Vũ khí tự tạo / vật cản", C: "Vũ khí hạt nhân", D: "Vũ khí sinh học" }, a: "B" },
        { l: "Bài 6", q: "Tác dụng của việc sử dụng vũ khí tự tạo trong chiến tranh nhân dân là gì?", opts: { A: "Tiêu diệt máy bay ném bom chiến lược", B: "Thay thế hoàn toàn súng đạn hiện đại", C: "Tiêu hao, tiêu diệt sinh lực địch, gây tâm lý hoang mang, cản trở cơ động", D: "Đánh chặn tên lửa hành trình" }, a: "C" }
    ];

    const form = document.getElementById("quizForm");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    let answeredQuestions = new Set();

    // Sinh HTML câu hỏi
    function renderQuiz() {
        let html = '';
        questions.forEach((q, i) => {
            html += `
            <div class="question-card" id="qCard${i}">
                <div class="lesson-tag">${q.l}</div>
                <div class="question-title">Câu ${i + 1}: ${q.q}</div>
                <div class="options">
            `;
            for (const [key, value] of Object.entries(q.opts)) {
                html += `
                    <label class="option-label" id="lbl_${i}_${key}">
                        <input type="radio" name="q${i}" value="${key}" onchange="updateProgress(${i})">
                        ${key}. ${value}
                    </label>
                `;
            }
            html += `</div></div>`;
        });
        form.innerHTML = html;
    }

    // Cập nhật thanh tiến trình
    function updateProgress(questionIndex) {
        answeredQuestions.add(questionIndex);
        const count = answeredQuestions.size;
        const total = questions.length;
        const percent = (count / total) * 100;
        
        progressBar.style.width = percent + '%';
        progressText.innerText = `Đã trả lời: ${count}/${total} câu`;
    }

    // Nộp bài
    function submitQuiz() {
        if(answeredQuestions.size < questions.length) {
            const confirmSubmit = confirm(`Tổng tài mới làm ${answeredQuestions.size}/${questions.length} câu. Ngài có chắc chắn muốn nộp bài không?`);
            if(!confirmSubmit) return;
        }

        let score = 0;
        questions.forEach((q, i) => {
            // Reset CSS cũ
            for (const key of Object.keys(q.opts)) {
                document.getElementById(`lbl_${i}_${key}`).classList.remove('correct', 'wrong');
            }

            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            
            if (selected) {
                const ans = selected.value;
                if (ans === q.a) {
                    score++;
                    document.getElementById(`lbl_${i}_${ans}`).classList.add('correct');
                } else {
                    document.getElementById(`lbl_${i}_${ans}`).classList.add('wrong');
                    document.getElementById(`lbl_${i}_${q.a}`).classList.add('correct');
                }
            } else {
                // Bôi xanh đáp án đúng nếu chưa làm
                document.getElementById(`lbl_${i}_${q.a}`).classList.add('correct');
            }
        });

        // Hướng dẫn hiển thị kết quả
        const resultBoard = document.getElementById('result-board');
        const scoreCircle = document.getElementById('scoreCircle');
        const scoreMessage = document.getElementById('scoreMessage');
        
        resultBoard.style.display = 'block';
        scoreCircle.innerText = `${score}/${questions.length}`;
        
        const percent = score / questions.length;
        if (percent >= 0.8) {
            scoreCircle.className = 'score-circle score-pass';
            scoreMessage.innerText = "Xuất sắc! Quả không hổ danh là Lọ thánh chí tôn! 👑";
            scoreMessage.style.color = "var(--success)";
        } else if (percent >= 0.5) {
            scoreCircle.className = 'score-circle score-pass';
            scoreMessage.innerText = "Khá lắm! Tổng tài nắm bài rất vững! 👍";
            scoreMessage.style.color = "#059669";
        } else {
            scoreCircle.className = 'score-circle score-fail';
            scoreMessage.innerText = "Tổng tài cần ôn lại binh pháp thêm chút nữa! 📚";
            scoreMessage.style.color = "var(--danger)";
        }

        // Cuộn mượt lên trên cùng
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Vô hiệu hóa form
        const inputs = document.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => input.disabled = true);
    }

    // Khởi chạy
    renderQuiz();
</script>

</body>
</html>
